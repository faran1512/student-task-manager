<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Task Manager</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1>Student Task Manager</h1>
        <p class="text-muted text-center mb-4">Keep track of your tasks.</p>

        <!-- Task form -->
        <div class="task-form mb-4">
          <input type="text" id="taskTitle" class="form-control mb-2" placeholder="Task title">
          <textarea id="taskDescription" class="form-control mb-2" rows="3" placeholder="Task description"></textarea>
          <button class="btn btn-danger w-100" onclick="addTask()">Add Task</button>
        </div>

        <!-- Search tasks -->
        <div class="mb-4">
          <label for="taskSearch" class="form-label fw-semibold">Search Tasks</label>
          <input
            type="search"
            id="taskSearch"
            class="form-control"
            placeholder="Search by task title or description..."
            oninput="searchTasks()"
          >
        </div>

        <!-- Task list -->
        <ul id="taskList" class="list-group">
          <li class="list-group-item text-muted">No tasks yet.</li>
        </ul>
      </div>
    </div>
  </div>

  <script>
    function searchTasks() {
      const searchInput = document.getElementById("taskSearch");
      const taskList = document.getElementById("taskList");
      const query = searchInput.value.trim().toLowerCase();
      const tasks = taskList.querySelectorAll("li");

      let visibleTasks = 0;

      tasks.forEach(task => {
        // Ignore the default message and previous "no results" message.
        if (
          task.id === "noTasksMessage" ||
          task.id === "noSearchResults" ||
          task.textContent.trim().toLowerCase() === "no tasks yet."
        ) {
          return;
        }

        const matches = task.textContent.toLowerCase().includes(query);
        task.style.display = matches ? "" : "none";

        if (matches) {
          visibleTasks++;
        }
      });

      let noResults = document.getElementById("noSearchResults");

      if (query && visibleTasks === 0) {
        if (!noResults) {
          noResults = document.createElement("li");
          noResults.id = "noSearchResults";
          noResults.className = "list-group-item text-muted text-center";
          taskList.appendChild(noResults);
        }

        noResults.textContent = `No tasks found for "${searchInput.value}".`;
        noResults.style.display = "";
      } else if (noResults) {
        noResults.style.display = "none";
      }
    }
  </script>

  <script src="script.js"></script>
</body>
</html>
