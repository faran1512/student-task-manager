<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Task Manager</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1>Student Task Manager</h1>
        <p class="text-muted text-center mb-4">Keep track of your tasks.</p>

        <!-- Task form -->
        <div class="task-form mb-4">
          <input type="text" id="taskTitle" class="form-control mb-2" placeholder="Task title">
          <textarea id="taskDescription" class="form-control mb-2" rows="3" placeholder="Task description"></textarea>
          <button class="btn btn-danger w-100" onclick="addTask()">Add Task</button>
        </div>

        <!-- Task list -->
        <ul id="taskList" class="list-group">
          <li class="list-group-item text-muted">No tasks yet.</li>
        </ul>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
